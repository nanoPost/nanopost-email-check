name: Update WordPress.org listing

# Started by hand (Actions > Update WordPress.org listing > Run workflow). Publishes
# readme.txt and the images in .wordpress-org/ to WordPress.org without a new plugin
# version: for "Tested up to", screenshots, the description or the FAQ.
#
# Refuses to run when:
# - the readme "Stable tag" is not a final version that has a git tag (on main it can be
#   a release candidate, which does not exist on WordPress.org), or
# - plugin code differs from what WordPress.org has (the 10up action checks this).
#
# Needs the repository secrets SVN_USERNAME and SVN_PASSWORD.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  listing:
    runs-on: ubuntu-latest
    steps:
      - name: SVN credentials must be set
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: |
          if [ -z "$SVN_USERNAME" ] || [ -z "$SVN_PASSWORD" ]; then
            echo "::error::Add the repository secrets SVN_USERNAME and SVN_PASSWORD (only after WordPress.org approval)."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Stable tag must be a released final version
        run: |
          stable="$(grep -m1 -E '^Stable tag:' readme.txt | awk '{print $NF}')"
          echo "stable=$stable"
          echo "$stable" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "::error::Stable tag $stable is not a final version. Release it first."
            exit 1
          }
          git rev-parse -q --verify "refs/tags/$stable" >/dev/null || {
            echo "::error::No git tag $stable. Release it first."
            exit 1
          }

      - uses: 10up/action-wordpress-plugin-asset-update@2.2.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: nanopost-email-check
