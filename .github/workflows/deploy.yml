name: Deploy to WordPress.org

# Runs when a version tag (for example 1.0.0) is pushed. Needs the repository secrets
# SVN_USERNAME and SVN_PASSWORD (the WordPress.org account). The plugin files come from
# git archive, so .gitattributes export-ignore decides what ships. Listing images come from
# .wordpress-org/.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Tag must match the plugin version and the stable tag
        run: |
          tag="${GITHUB_REF_NAME}"
          header="$(grep -m1 -E '^ \* Version:' nanopost-email-check.php | awk '{print $NF}')"
          stable="$(grep -m1 -E '^Stable tag:' readme.txt | awk '{print $NF}')"
          echo "tag=$tag header=$header stable=$stable"
          test "$tag" = "$header" && test "$tag" = "$stable"

      - uses: 10up/action-wordpress-plugin-deploy@2.3.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: nanopost-email-check
