name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  phpcs:
    name: Coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - run: composer install --no-interaction --no-progress

      - run: vendor/bin/phpcs

  plugin-check:
    name: Plugin Check (release files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Check exactly what ships: the tracked files that git archive puts in the zip.
      - name: Build release folder
        run: |
          mkdir -p build/nanopost-email-check
          git archive HEAD | tar -x -C build/nanopost-email-check

      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: build/nanopost-email-check
          slug: nanopost-email-check

      # The zip to upload to WordPress.org: the same files, as git archive builds them.
      - name: Build release zip
        run: git archive --format=zip --prefix=nanopost-email-check/ -o nanopost-email-check.zip HEAD

      - uses: actions/upload-artifact@v5
        with:
          name: nanopost-email-check-zip
          path: nanopost-email-check.zip
          retention-days: 30

  integration:
    name: Integration tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: WP 6.4, PHP 7.4
            core: WordPress/WordPress#6.4
            php: '7.4'
            multisite: false
          - name: WP latest, PHP 7.4
            core: ''
            php: '7.4'
            multisite: false
          - name: WP latest, PHP 8.3
            core: ''
            php: '8.3'
            multisite: false
          - name: WP latest, PHP 8.3, multisite
            core: ''
            php: '8.3'
            multisite: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Multisite config
        if: ${{ matrix.multisite }}
        run: echo '{ "multisite": true }' > .wp-env.override.json

      - run: npx wp-env start
        env:
          WP_ENV_CORE: ${{ matrix.core }}
          WP_ENV_PHP_VERSION: ${{ matrix.php }}

      - name: Versions
        run: |
          npx wp-env run cli wp eval 'echo "WordPress ", get_bloginfo("version"), ", PHP ", PHP_VERSION, is_multisite() ? ", multisite" : "", PHP_EOL;'

      - run: npm test
